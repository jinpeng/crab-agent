name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # Q17: binary-size hard assert. Measured: 6.90 MiB macOS at M4, ~10 MiB macOS /
      # ~12.5 MiB Linux after MCP (rmcp) + web_fetch (dom_smoothie). Freeze at 16 MiB
      # to cover the Linux/macOS delta plus headroom, while still catching bloat.
      - name: release size budget
        run: |
          cargo build --release -p crab-cli
          SIZE=$(stat -c%s target/release/crab 2>/dev/null || stat -f%z target/release/crab)
          echo "release crab: $SIZE bytes"
          test "$SIZE" -lt 16777216 || { echo "SIZE BUDGET EXCEEDED (>16MiB)"; exit 1; }
