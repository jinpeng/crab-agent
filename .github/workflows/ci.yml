name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # Q17: binary-size hard assert. Measured on CI (Linux, v0.6.0):
      # 17,209,680 bytes (16.4 MiB) with lto=thin + strip. Earlier 16 MiB
      # budget was an estimate and was too tight. Freeze at 20 MiB to keep
      # ~22% headroom while still catching bloat.
      - name: release size budget
        run: |
          cargo build --release -p crab-cli
          SIZE=$(stat -c%s target/release/crab 2>/dev/null || stat -f%z target/release/crab)
          echo "release crab: $SIZE bytes"
          test "$SIZE" -lt 20971520 || { echo "SIZE BUDGET EXCEEDED (>20MiB)"; exit 1; }
