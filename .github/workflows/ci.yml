name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # Q17: binary-size hard assert. Measured at M4 completion: 6.90 MiB (7235328 B)
      # on macOS. Linux release build differs; freeze at 12 MiB ceiling to be safe
      # across platforms. Deterministic (same code = same size class), unlike timing.
      - name: release size budget
        run: |
          cargo build --release -p crab-cli
          SIZE=$(stat -c%s target/release/crab 2>/dev/null || stat -f%z target/release/crab)
          echo "release crab: $SIZE bytes"
          test "$SIZE" -lt 12582912 || { echo "SIZE BUDGET EXCEEDED (>12MiB)"; exit 1; }
