[workspace]
resolver = "3"
members = ["crates/crab-core", "crates/crab-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
ignore = "0.4"
similar = "3"
tempfile = "3.27"
shell-words = "1"
walkdir = "2"
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "json", "stream"] }
eventsource-stream = "0.2"
dom_smoothie = "0.18"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
