# crab built-in pricing (USD per 1M tokens), embedded at compile time.
# Schema v2: per model a [[versions]] chain; cost resolves at the CALL TIME.
#
# Conventions:
#   - `input` prices only the UNCACHED input (prompt - cache_read), per the
#     DeepSeek/Kimi usage convention where prompt_tokens includes cache hits.
#   - DeepSeek-style APIs fold cache-write cost into the miss price
#     (cache_write = 0). Kimi K3 bills cache writes separately by TTL; the
#     default 5min tier is used (cache_write = 3.00).
#   - Windows are peak overlays: base = off-peak, window rates = peak.
#   - weekdays: 1 = Monday .. 7 = Sunday; omitted = every day. Chinese public
#     holidays are NOT expressible — those days are priced as peak.
#
# Verified 2026-10-20 against:
#   DeepSeek  https://api-docs.deepseek.com/quick_start/pricing
#   Kimi      https://platform.kimi.ai/docs/pricing/chat.md
# `since` dates below = verification date; calls before it fall through to an
# earlier version (or show '-' when there is none). Append historical versions
# with earlier `since` values as providers adjust prices.

# ---- DeepSeek (peak: Mon-Fri 01:00-04:00 & 06:00-10:00 UTC, half price off-peak) ----

[models.deepseek-flash]
[[models.deepseek-flash.versions]]
since = "2026-10-20T00:00:00+08:00"
input = 0.15
output = 0.60
cache_read = 0.003
cache_write = 0.0
[[models.deepseek-flash.versions.windows]]
start = "01:00"
end = "04:00"
tz = "Z"
weekdays = [1, 2, 3, 4, 5]
input = 0.30
output = 1.20
cache_read = 0.006
[[models.deepseek-flash.versions.windows]]
start = "06:00"
end = "10:00"
tz = "Z"
weekdays = [1, 2, 3, 4, 5]
input = 0.30
output = 1.20
cache_read = 0.006

[models.deepseek-v4-pro]
[[models.deepseek-v4-pro.versions]]
since = "2026-10-20T00:00:00+08:00"
input = 0.66
output = 1.98
cache_read = 0.022
cache_write = 0.0
[[models.deepseek-v4-pro.versions.windows]]
start = "01:00"
end = "04:00"
tz = "Z"
weekdays = [1, 2, 3, 4, 5]
input = 1.32
output = 3.96
cache_read = 0.044
[[models.deepseek-v4-pro.versions.windows]]
start = "06:00"
end = "10:00"
tz = "Z"
weekdays = [1, 2, 3, 4, 5]
input = 1.32
output = 3.96
cache_read = 0.044

