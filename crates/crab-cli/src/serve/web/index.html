<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>crab</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif;
         background: #111418; color: #d7dce2; }
  header { position: sticky; top: 0; background: #171b21; padding: 10px 14px;
           border-bottom: 1px solid #262c35; font-size: 13px; color: #8b94a0;
           display: flex; gap: 10px; align-items: center; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  header .dot.on { background: #4caf7d; }
  main { padding: 10px 14px 80px; }
  .ev { padding: 3px 0; border-bottom: 1px solid #1b2027; word-break: break-word; }
  .ev .k { color: #6f7887; font-size: 12px; margin-right: 8px; }
  form { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px;
         padding: 10px 14px; background: #171b21; border-top: 1px solid #262c35; }
  input { flex: 1; background: #111418; border: 1px solid #2c333d; color: #d7dce2;
          padding: 9px 10px; border-radius: 6px; font-size: 15px; }
  button { background: #2d6cdf; color: #fff; border: 0; padding: 9px 14px;
           border-radius: 6px; font-size: 15px; }
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><span id="status">connecting…</span></header>
<main id="log"></main>
<form id="f"><input id="in" placeholder="prompt" autocomplete="off"><button>send</button></form>
<script>
const tok = new URLSearchParams(location.search).get('token') || '';
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');
let ws, seq = 0;

function add(kind, text) {
  const d = document.createElement('div');
  d.className = 'ev';
  d.innerHTML = `<span class="k">${kind}</span>${text.replace(/</g,'&lt;')}`;
  log.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
}

function connect() {
  ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(tok)}`);
  ws.onopen = () => {
    statusEl.textContent = 'connected';
    dot.className = 'dot on';
    ws.send(JSON.stringify({id:'1', type:'status'}));
    ws.send(JSON.stringify({id:'2', type:'attach'}));
  };
  ws.onclose = () => {
    statusEl.textContent = 'disconnected — retrying in 2s';
    dot.className = 'dot';
    setTimeout(connect, 2000);
  };
  ws.onmessage = (m) => {
    const r = JSON.parse(m.data);
    if (r.type === 'response' && r.ok && r.data) {
      if (r.data.state) statusEl.textContent =
        `${r.data.host} · crab ${r.data.version} · ${r.data.workspace} · ${r.data.state.run_state}`;
      if (r.data.head_seq !== undefined) {
        statusEl.textContent += ` · seq ${r.data.head_seq}`;
        if (r.data.replay) for (const [s, e] of r.data.replay) show(s, e);
        seq = r.data.head_seq;
      }
    } else if (r.type === 'event') {
      show(r.seq, r.event);
      seq = r.seq;
    } else if (r.type === 'response' && !r.ok) {
      add('err', r.error || 'unknown error');
    }
  };
}

function show(s, e) {
  if (e.kind === 'text_delta') add('text', e.text);
  else if (e.kind === 'turn_started') add('run', `turn ${e.turn}`);
  else if (e.kind === 'finished') add('done', String(e.reason));
  else if (e.kind === 'tool_call_started') add('tool', e.name);
  else if (e.kind === 'tool_call_finished') add('tool', e.is_error ? '✗ error' : '✓');
  else add('ev', e.kind);
}

document.getElementById('f').onsubmit = (ev) => {
  ev.preventDefault();
  const v = document.getElementById('in').value.trim();
  if (!v) return;
  ws.send(JSON.stringify({id:String(++seq+1000), type:'prompt', text:v}));
  document.getElementById('in').value = '';
};
connect();
</script>
</body>
</html>
