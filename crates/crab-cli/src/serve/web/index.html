<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>crab</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif;
         background: #111418; color: #d7dce2; overscroll-behavior: none; }
  header { position: sticky; top: 0; z-index: 10; background: #171b21;
           padding: 10px 14px; border-bottom: 1px solid #262c35;
           display: flex; gap: 10px; align-items: center; font-size: 13px; color: #8b94a0; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex: none; }
  header .dot.on { background: #4caf7d; }
  header .ws-name { color: #d7dce2; font-weight: 600; }
  header select { background: #111418; color: #d7dce2; border: 1px solid #2c333d;
                  border-radius: 5px; padding: 4px 6px; font-size: 13px; max-width: 45vw; }
  header .spacer { flex: 1; }
  main { padding: 8px 14px 118px; }
  .ev { padding: 4px 0; border-bottom: 1px solid #1b2027; word-break: break-word; }
  .ev .k { color: #6f7887; font-size: 11px; margin-right: 8px; text-transform: uppercase; }
  .ev.text .k { color: #4caf7d; }
  .ev.run .k { color: #5b9bd5; }
  .ev.tool .k { color: #c9a227; }
  .ev.err, .ev.error .k { color: #d5635b; }
  .confirm-card { position: sticky; bottom: 76px; margin: 8px 0; padding: 12px;
                  background: #1d232c; border: 1px solid #c9a227; border-radius: 10px;
                  box-shadow: 0 4px 24px rgba(0,0,0,.5); z-index: 20; }
  .confirm-card .sum { font-size: 14px; margin-bottom: 10px; word-break: break-all; }
  .confirm-card .row { display: flex; gap: 8px; }
  .confirm-card button { flex: 1; padding: 10px; border-radius: 7px; border: 0; font-size: 15px; }
  .btn-y { background: #2f7d4f; color: #fff; }
  .btn-n { background: #7d3530; color: #fff; }
  .btn-a { background: #6b5b1f; color: #fff; }
  form { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px;
         padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
         background: #171b21; border-top: 1px solid #262c35; }
  input { flex: 1; background: #111418; border: 1px solid #2c333d; color: #d7dce2;
          padding: 10px; border-radius: 7px; font-size: 16px; }
  form button { background: #2d6cdf; color: #fff; border: 0; padding: 10px 16px;
                border-radius: 7px; font-size: 15px; }
  #abort { background: #7d3530; padding: 10px 12px; }
  #toolbar { position: fixed; bottom: calc(60px + env(safe-area-inset-bottom));
             left: 0; right: 0; display: flex; gap: 6px; padding: 6px 14px;
             background: #171b21; border-top: 1px solid #262c35; overflow-x: auto; }
  #toolbar button { background: #232a34; color: #aab4c0; border: 0; padding: 6px 10px;
                    border-radius: 6px; font-size: 12px; white-space: nowrap; }
  #empty { color: #525a66; text-align: center; margin-top: 30vh; font-size: 14px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <select id="ws" title="workspace"></select>
  <span id="st">connecting…</span>
  <span class="spacer"></span>
  <span id="ctx"></span>
  <span style="font-size:10px;color:#3a424d" id="dbg"></span>
</header>
<main id="log"><div id="empty">waiting for activity…</div></main>
<div id="confirms"></div>
<div id="toolbar">
  <button data-cmd="compact">compact</button>
  <button data-cmd="reflect">reflect</button>
</div>
<form id="f">
  <button type="button" id="abort" title="abort">✕</button>
  <input id="in" placeholder="prompt or /command" autocomplete="off">
  <button>send</button>
</form>
<script>
const tok = new URLSearchParams(location.search).get('token') || localStorage.crabToken || '';
if (tok) localStorage.crabToken = tok;
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
// ws 走独立端口（serve 的 wss 端口 = http 端口 + 2，见 serve.rs）。
const wsPort = String(Number(location.port || (location.protocol === 'https:' ? 443 : 80)) + 2);
const wsHost = `${location.hostname}:${wsPort}`;
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const st = document.getElementById('st');
const ctx = document.getElementById('ctx');
const dot = document.getElementById('dot');
const wsSel = document.getElementById('ws');
const confirmsEl = document.getElementById('confirms');
let ws, seq = 0, activeWs = '', runState = 'idle', reqSeq = 100;
// 拉取式架构：客户端自记 offset（localStorage）。serve 重启会重置 seq，
// 所以还要记 boot_id——发现变了就重置 offset=0（防旧 offset 永远拉不到）。
let offset = Number(localStorage.crabOffset || 0);
let bootId = localStorage.crabBootId || '';
const pendingConfirms = new Map();
function dbgSet(s) { const d = document.getElementById('dbg'); if (d) d.textContent = s; }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if ('Notification' in window && Notification.permission === 'default') {
  // Ask lazily on first user interaction to avoid the cold prompt.
  document.body.addEventListener('click', () => Notification.requestPermission(), { once: true });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function add(kind, text, tool) {
  empty.style.display = 'none';
  const d = document.createElement('div');
  d.className = 'ev ' + kind;
  d.innerHTML = `<span class="k">${tool || kind}</span>${esc(text)}`;
  log.appendChild(d);
  window.scrollTo({ top: document.body.scrollHeight });
  // 后台且有运行活动时，favicon 标题提醒（无需推送服务）。
  if (document.hidden && (kind === 'text' || kind === 'run')) notify('crab', text.slice(0, 80));
}
function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body, icon: 'icon.svg', tag: 'crab', renotify: false }); } catch (_) {}
}

// POST /cmd：控制命令（prompt/approve/abort/...）。
async function cmd(v) {
  try {
    const r = await fetch(`/cmd?token=${encodeURIComponent(tok)}`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(v),
    });
    return await r.json();
  } catch (e) { add('err', 'cmd failed: ' + e); return null; }
}

// 长轮询拉取循环：after_id=offset，hold 30s 或新事件到达。断线自动重连。
let pulling = false;
async function pullLoop() {
  if (pulling) return;
  pulling = true;
  dot.className = 'dot on';
  for (;;) {
    // 看门狗：Safari 后台/锁屏会永久挂起长 fetch——超过 timeout+缓冲
    // 未返回就 abort 重试，否则循环卡死、confirm_req 永远拉不到（这就是
    // "卡片要等刷新才出现"的根因）。
    const ctl = new AbortController();
    forceRepull = () => ctl.abort(); // 页面恢复可见时主动中断重拉
    const watchdog = setTimeout(() => ctl.abort(), 35000);
    const t0 = Date.now();
    try {
      const r = await fetch(`/events?token=${encodeURIComponent(tok)}&after_id=${offset}&timeout=30`,
        { signal: ctl.signal });
      clearTimeout(watchdog);
      if (!r.ok) { dot.className = 'dot'; st.textContent = 'http ' + r.status; await sleep(2000); continue; }
      const d = await r.json();
      const nEv = (d.events || []).length;
      // 拉取时序打点：显示本次 fetch 耗时 + 拉到几个事件 + 当前 offset。
      // 诊断"服务端毫秒级唤醒但手机 30s 才见"——看是 fetch 本身慢还是事件少。
      dbgSet(`pull ${Date.now()-t0}ms +${nEv} @${offset}`);
      dot.className = 'dot on';
      // 自愈：客户端 offset 超过服务端高水位（serve 重启 seq 重置，或旧
      // localStorage 残留）——直接跳到最新。这是幂等防线，不依赖 boot_id。
      if (offset > d.high_watermark) {
        offset = d.high_watermark;
        localStorage.crabOffset = offset;
        add('run', 'resynced to latest (offset reset)', 'sync');
      }
      // pending 审批快照（与 offset 无关）——重连即见未决审批。
      if (d.pending_confirms) for (const p of d.pending_confirms) {
        if (!pendingConfirms.has(p.id)) showConfirm(p.id, p.tool, p.summary);
      }
      for (const e of d.events || []) {
        offset = Math.max(offset, e.id);
        localStorage.crabOffset = offset;
        onEvent(e.entry);
      }
      // 落后太多（>1000）则跳到最新并提示（Q10）。
      if (d.high_watermark > offset + 1000) {
        offset = d.high_watermark;
        localStorage.crabOffset = offset;
        add('run', `skipped to latest (lagged)`, 'sync');
      }
    } catch (e) {
      clearTimeout(watchdog);
      dot.className = 'dot'; st.textContent = 'reconnecting…';
      // 诊断：显示 fetch 具体错误（AbortError=看门狗/恢复可见，TypeError=网络，
      // 其他=意外）+ 距上次成功的时长——定位 confirm_req 那次 fetch 为何失败。
      dbgSet(`pull ERR ${e.name || e} @${offset}`);
      await sleep(1000); // abort/网络错——短等后重试（看门狗唤醒后尽快重拉）
    }
  }
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// 页面从后台/锁屏恢复时，强制中断当前 hold 的 fetch 立即重拉——Safari
// 暂停 JS 期间错过的 confirm_req 靠这次重拉补上（不等 30s hold 自然超时）。
let forceRepull = null;
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && forceRepull) forceRepull();
});

// 启动：先 attach 拿 boot_id（serve 重启检测），再进拉取循环。
async function start() {
  const r = await cmd({ id: 'a1', type: 'attach' });
  if (r && r.data && r.data.boot_id !== undefined) {
    const bid = String(r.data.boot_id);
    if (bootId && bootId !== bid) {
      // serve 重启了——seq 重置，旧 offset 失效，从 0 重新拉（近期 200 条）。
      offset = 0;
      localStorage.crabOffset = 0;
      add('run', 'serve restarted, resynced from latest', 'sync');
    }
    bootId = bid;
    localStorage.crabBootId = bid;
  }
  if (r) onResp(r);
  const wl = await cmd({ id: 'w1', type: 'workspace.list' });
  if (wl) onResp(wl);
  pullLoop();
}

function onResp(r) {
  if (!r.ok) return add('err', r.error || 'error');
  const d = r.data || {};
  if (d.state) {
    st.textContent = `${d.host} · ${d.state.run_state}`;
    runState = d.state.run_state;
  }
  if (d.workspaces) renderWorkspaces(d.workspaces, d.active);
  if (d.active && !d.workspaces) { activeWs = d.active; syncWsSelect(); }
}
function onEvent(e, isReplay) {
  const wsname = e.workspace || '';
  if (wsname && activeWs && wsname !== activeWs && e.kind !== 'confirm_req') return; // 只看激活
  switch (e.kind) {
    case 'turn_started': runState = 'running'; st.textContent = 'running'; add('run', `turn ${e.turn}`); break;
    case 'finished': runState = 'idle'; st.textContent = 'idle'; add('done', e.reason);
      if (document.hidden) notify('crab done', 'agent finished'); break;
    case 'text_delta': add('text', e.text); break;
    case 'assistant_message': if (e.text) add('text', e.text); break;
    case 'tool_call_started': add('tool', e.name, 'tool'); break;
    case 'tool_call_finished': add('tool', e.is_error ? '✗ error' : '✓ done', 'tool'); break;
    case 'usage': ctx.textContent = `↑${e.prompt} ↓${e.completion}`; break;
    case 'compacted': add('run', `compacted ${e.turns} turns`, 'compact'); break;
    case 'confirm_req':
      // 最强视觉标记：整页背景闪黄，不依赖卡片 DOM——排除 showConfirm 的
      // 任何失败路径。事件到了就一定会变。
      document.body.style.background = '#3a3000';
      dbgSet('CONFIRM_REQ id=' + e.confirm_id);
      showConfirm(e.confirm_id, e.tool, e.summary);
      break;
    case 'confirm_resolved':
      document.body.style.background = '';
      dbgSet('resolved ' + e.confirm_id);
      hideConfirm(e.confirm_id);
      break;
    case 'workspace.added': case 'workspace.switched': cmd({id:'w2',type:'workspace.list'}).then(r=>r&&onResp(r)); break;
    case 'steer.queued': add('run', e.text, 'steer'); break;
    case 'reflected': add('run', `remembered ${e.accepted}/${e.total} lessons`, 'reflect'); break;
    case 'warn': case 'error': add('err', e.text || 'warning'); break;
  }
}

function renderWorkspaces(list, active) {
  activeWs = active || activeWs;
  wsSel.innerHTML = '';
  for (const w of list) {
    const o = document.createElement('option');
    o.value = w; o.textContent = w.split('/').slice(-2).join('/');
    o.title = w;
    wsSel.appendChild(o);
  }
  syncWsSelect();
}
function syncWsSelect() {
  for (const o of wsSel.options) o.selected = (o.value === activeWs);
}
wsSel.onchange = () => {
  const target = wsSel.value;
  if (target && target !== activeWs) {
    cmd({id: 'sw' + (++reqSeq), type: 'workspace.switch', name: target});
  }
};

// ---- approvals ----
function showConfirm(id, tool, summary) {
  if (pendingConfirms.has(id)) return;
  const card = document.createElement('div');
  card.className = 'confirm-card';
  card.innerHTML = `<div class="sum"><b>${esc(tool)}</b> — ${esc(summary)}</div>
    <div class="row">
      <button class="btn-y" data-d="allow">allow</button>
      <button class="btn-n" data-d="deny">deny</button>
      <button class="btn-a" data-d="allow_all">all</button>
    </div>`;
  card.querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      cmd({id:'ap'+id, type:'approve', confirm_id:id, decision:b.dataset.d});
      hideConfirm(id);
    };
  });
  pendingConfirms.set(id, card);
  confirmsEl.appendChild(card);
  // vibrate/scrollIntoView 在部分浏览器（非用户手势触发）会抛异常，
  // 阻断后续渲染——包裹 try/catch 容错。
  try { if (navigator.vibrate) navigator.vibrate([30, 40, 30]); } catch (_) {}
  try { card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (_) {}
}
function hideConfirm(id) {
  const c = pendingConfirms.get(id);
  if (c) { c.remove(); pendingConfirms.delete(id); }
}

// ---- input ----
document.getElementById('f').onsubmit = (ev) => {
  ev.preventDefault();
  const inp = document.getElementById('in');
  const v = inp.value.trim();
  if (!v) return;
  // 运行中输入自动变 steer（mid-run 引导），空闲则是新 prompt。
  const type = runState === 'running' ? 'steer' : 'prompt';
  cmd({id:'p'+(++reqSeq), type, text:v});
  inp.value = '';
};
document.getElementById('abort').onclick = () => {
  cmd({id:'ab'+(++reqSeq), type:'abort'});
};
document.querySelectorAll('#toolbar button').forEach((b) => {
  b.onclick = () => {
    cmd({id:'t'+(++reqSeq), type: b.dataset.cmd});
  };
});
start();
</script>
</body>
</html>
